name: dartscl_app
description: "Web UI frontend for DartSCL"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  dartscl_protocol:
    path: ../dartscl_protocol
  flutter_riverpod: ^3.4.2
  google_fonts: ^8.2.1
  http: ^1.2.0
  riverpod_annotation: ^4.0.6
  cupertino_icons: ^1.0.8
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.16.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.8

flutter:
  uses-material-design: true
